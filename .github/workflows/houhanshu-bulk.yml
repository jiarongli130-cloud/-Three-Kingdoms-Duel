name: houhanshu-batch4-temp

on:
  push:
    branches:
      - tmp/houhanshu-bulk-20260825
    paths:
      - .github/workflows/houhanshu-bulk.yml

permissions:
  contents: write

jobs:
  inspect-secondary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/houhanshu-bulk-20260825
      - name: Clone secondary source
        run: git clone --depth 1 https://github.com/quzhi1/ChineseHistoricalSource.git /tmp/chs
      - name: Inspect Hou Hanshu secondary file
        shell: bash
        run: |
          mkdir -p houhanshu_batch4_inspect
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          p=Path('/tmp/chs/utf8/03后汉书.TXT')
          b=p.read_bytes()
          t=b.decode('utf-8')
          lines=t.splitlines()
          info={
            'bytes':len(b),'chars':len(t),'lines':len(lines),
            'sha1':hashlib.sha1(b).hexdigest(),'sha256':hashlib.sha256(b).hexdigest(),
            'replacement_chars':t.count('\ufffd'),
          }
          Path('houhanshu_batch4_inspect/info.json').write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('houhanshu_batch4_inspect/head.txt').write_text('\n'.join(lines[:220])+'\n',encoding='utf-8')
          Path('houhanshu_batch4_inspect/tail.txt').write_text('\n'.join(lines[-220:])+'\n',encoding='utf-8')
          keys=['世祖光武皇帝諱秀','顯宗孝明皇帝諱莊','曹操','劉備','孫權','袁紹','董卓','官渡','獻帝','志第三 律曆下','志第三十 輿服下']
          out=[]
          for k in keys:
            pos=t.find(k)
            out.append(f'KEY={k} POS={pos}')
            if pos>=0:
              out.append(t[max(0,pos-300):pos+900].replace('\r',''))
              out.append('---')
          Path('houhanshu_batch4_inspect/key_samples.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          # Header-like lines for structural inspection.
          heads=[ln for ln in lines if re.search(r'(卷第|卷一|本紀|列傳|志第)',ln)][:500]
          Path('houhanshu_batch4_inspect/header_candidates.txt').write_text('\n'.join(heads)+'\n',encoding='utf-8')
          print(json.dumps(info,ensure_ascii=False))
          PY
      - name: Commit inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add houhanshu_batch4_inspect
          git commit -m "temp: inspect Hou Hanshu secondary source" || true
          git push origin HEAD:tmp/houhanshu-bulk-20260825
