name: houhanshu-batch4-followup

on:
  push:
    branches:
      - tmp/houhanshu-bulk-20260825
    paths:
      - .github/workflows/houhanshu-bulk.yml

permissions:
  contents: write

jobs:
  followup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/houhanshu-bulk-20260825
      - name: Fetch only secondary raw file
        run: curl -L --fail --silent --show-error 'https://raw.githubusercontent.com/quzhi1/ChineseHistoricalSource/main/utf8/03后汉书.TXT' -o /tmp/sec.txt
      - name: Diagnose missing volume 46 and strict misses
        shell: bash
        run: |
          python3 -m pip install --quiet opencc-python-reimplemented
          python3 - <<'PY'
          from pathlib import Path
          import re, csv, json, difflib
          from opencc import OpenCC
          cc=OpenCC('t2s')
          raw=Path('/tmp/sec.txt').read_text(encoding='utf-8-sig')
          def resolve(s):
              old=None
              while old!=s:
                  old=s
                  s=re.sub(r'\*\(([^()]*)\)\*\*\[([^\]]*)\]\*',lambda m:m.group(2),s)
                  s=re.sub(r'\*\[([^\]]*)\]\*',lambda m:m.group(1),s)
                  s=re.sub(r'\*\(([^()]*)\)\*','',s)
              return s
          refpat=re.compile(r'\[[一二三四五六七八九十百０0-9]+\]')
          punct=re.compile(r'[\s\u3000，。；：！？、,.!?;:「」『』“”‘’《》〈〉（）()【】〔〕［］\[\]—…·﹑﹔﹕﹖﹗＊*#=<>/\\|\-]+')
          def norm(s,conv=False):
              s=resolve(s); s=refpat.sub('',s)
              if conv: s=cc.convert(s)
              return punct.sub('',s)
          sec=norm(raw,False)
          probes={
            'v46_Guo':'郭躬字仲孙颍川阳翟人也家世衣冠',
            'v46_Chen':'陈宠字昭公沛国洨人也',
            'v46_Guo_short':'郭躬字仲孙',
            'v46_Chen_short':'陈宠字昭公',
          }
          v46={k:{'query':q,'count':sec.count(q),'pos':sec.find(q)} for k,q in probes.items()}

          rows=[]
          with Path('houhanshu_batch4/spotcheck_30.tsv').open(encoding='utf-8') as f:
              for r in csv.DictReader(f,delimiter='\t'):
                  if r['status']=='MISS': rows.append(r)
          diag=[]
          for r in rows:
              q=norm(r['primary_excerpt'],True)
              best=None
              for k in range(min(24,len(q)),7,-1):
                  found=False
                  # deterministic dense scan across query
                  for i in range(0,max(1,len(q)-k+1)):
                      seed=q[i:i+k]
                      p=sec.find(seed)
                      if p>=0:
                          best=(k,i,seed,p); found=True; break
                  if found: break
              item={'volume':int(r['volume']),'kind':r['kind'],'best_seed_len':best[0] if best else 0,'best_seed':best[2] if best else '', 'seed_pos':best[3] if best else -1}
              if best:
                  k,i,seed,p=best
                  start=max(0,p-i-120); end=min(len(sec),p-i+len(q)+120)
                  window=sec[start:end]
                  # compare q against sliding windows near candidate; maximize SequenceMatcher ratio.
                  cand=[]
                  lo=max(0,p-start-i-80); hi=min(len(window),p-start-i+80)
                  for s in range(lo,hi+1,4):
                      w=window[s:s+len(q)]
                      if w:
                          cand.append((difflib.SequenceMatcher(None,q,w,autojunk=False).ratio(),s,w))
                  if cand:
                      ratio,s,w=max(cand,key=lambda x:x[0])
                      item['approx_ratio']=round(ratio,4)
                      item['secondary_window']=w[:220]
              diag.append(item)
          out={'volume46_probe':v46,'miss_diagnostics':diag}
          Path('houhanshu_batch4/followup.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit followup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add houhanshu_batch4/followup.json
          git commit -m "temp: diagnose Hou Hanshu batch4 misses" || true
          git push origin HEAD:tmp/houhanshu-bulk-20260825
